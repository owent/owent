name: Update profile

on:
  schedule:
    # 09:23 and 21:23 Asia/Shanghai; GitHub cron defaults to UTC.
    - cron: '23 1,13 * * *'
  workflow_dispatch:
  push:
    paths:
      - README.md
      - scripts/**
      - tests/**
      - .github/workflows/update-profile.yml
  pull_request:
    paths:
      - README.md
      - scripts/**
      - tests/**
      - .github/workflows/update-profile.yml

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test RSS parsing and README preservation
        run: python -m unittest discover -s tests -v

  update:
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'owent/owent' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Fetch the latest blog posts
        run: python scripts/update_recent_posts.py
      - name: Commit only when recent writing changes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs: refresh recent blog posts'
          git push origin "HEAD:${DEFAULT_BRANCH}"
